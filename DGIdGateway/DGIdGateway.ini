[DGId=0]
# Local YSF Gateway, this must be DGId=0 for Wires-X to work.
# DG-IDs 10 to 35 that have no section of their own are sent through this
# gateway with their DG-ID unchanged. XLX reflectors pick their module by
# DG-ID (10 = module A to 35 = module Z), fixed by XLXd and not configurable,
# so with the gateway linked to an XLX the radio's DG-ID selects the module.
# A DG-ID from 10 to 35 that has its own section always uses that network
# instead: a local DG-ID wins. This only happens while DG-ID 0 is the YSF
# Gateway (Type=Gateway): with anything else on DG-ID 0, or no DG-ID 0,
# DG-IDs 10 to 35 without a section of their own go nowhere.
Type=Gateway
Static=1
Address=127.0.0.1
Port=42025
Local=42026
